<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pine & Co Seoul — Front</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* 프론트 23.6" 모니터용 웰컴/웨이팅 화면. 1920×1080 기준으로 그리고 어떤 화면이든 비율 유지해 맞춘다. */
  :root{ --bg:#331f14; --gold:#d39d64; --gold2:#c9a66b; --line:#6b5236; --cream:#f1e7d3; --cream2:#e4d6bd; --ink:#1a120b; }
  html,body{ margin:0; height:100%; background:var(--bg); overflow:hidden; }
  /* 마우스 커서: 평소엔 보이고, 3초 안 움직이면 숨긴다(모니터 전시용) */
  body.idle{ cursor:none; }
  #stage{ position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform-origin:0 0; background:var(--bg); color:var(--cream); font-family:'Cormorant Garamond',Georgia,serif; }
  .frame{ position:absolute; inset:26px; border:2px solid var(--line); pointer-events:none; }
  .frame2{ position:absolute; inset:40px; border:1px solid var(--line); pointer-events:none; }
  .vline{ position:absolute; left:760px; top:110px; bottom:110px; width:1.5px; background:var(--line); }

  /* ── 왼쪽: QR ── */
  #left{ position:absolute; left:0; top:0; width:760px; height:1080px; text-align:center; }
  #logo{ position:absolute; left:50%; top:70px; width:176px; height:313px; transform:translateX(-50%); background:url(front/logo_gold.png) center/contain no-repeat; }
  .sp{ letter-spacing:.42em; color:var(--gold2); font-size:22px; text-transform:uppercase; }
  .rule{ position:absolute; left:120px; right:120px; display:flex; align-items:center; gap:28px; justify-content:center; }
  .rule i{ flex:1; height:1.5px; background:var(--line); }
  #scanto{ top:404px; }
  #qr{ position:absolute; left:50%; top:452px; width:360px; height:360px; transform:translateX(-50%); background:url(front/qr_wait.png) center/contain no-repeat; image-rendering:pixelated; border:6px solid #f3e9c8; box-sizing:content-box; }
  #srw{ position:absolute; left:0; right:0; top:852px; font-weight:600; font-size:26px; letter-spacing:.3em; color:var(--gold2); }
  #sub{ position:absolute; left:0; right:0; top:892px; font-size:23px; color:var(--cream2); line-height:1.45; }
  #sub .zh{ font-family:'Noto Sans KR','Microsoft YaHei',sans-serif; font-size:19px; }
  #howmini{ position:absolute; left:0; right:0; top:968px; font-size:18px; color:#a88c62; letter-spacing:.04em; }
  /* 실시간 대기: 작게. 많으면 손님이 질릴 수 있어 숫자를 크게 안 띄운다 */
  #wait{ position:absolute; left:50%; top:1010px; transform:translateX(-50%); display:inline-flex; align-items:center; gap:10px; padding:5px 14px; border:1px solid var(--line); border-radius:999px; font-size:17px; color:var(--gold2); letter-spacing:.08em; white-space:nowrap; }
  #wait b{ color:var(--cream); font-weight:600; }
  #wait .dot{ width:7px; height:7px; border-radius:50%; background:#6fcf8f; box-shadow:0 0 6px #6fcf8f; }
  #wait.off .dot{ background:#8a8d82; box-shadow:none; }

  /* ── 오른쪽: 웰컴 + Pat & Joe + 오늘의 칵테일 ── */
  #right{ position:absolute; left:760px; top:0; width:1160px; height:1080px; }
  /* 로고: ChatGPT(GPT-6 Astra)로 갈색 배경에 맞춰 금빛으로 다시 그린 것(front/welcome_gold.png, 2030×688). 오른쪽 칸을 가득 채우게 크게 */
  #welcome{ position:absolute; left:50%; top:76px; width:900px; height:306px; transform:translateX(-50%); background:url(front/welcome_gold.png) center/contain no-repeat; image-rendering:auto; filter:drop-shadow(0 8px 0 rgba(0,0,0,.45)); }
  #hello{ position:absolute; left:0; right:0; top:438px; text-align:center; font-family:'Press Start 2P',monospace; font-size:17px; color:var(--gold); letter-spacing:.06em; text-shadow:2px 2px 0 #000; }
  #hello .ko{ display:block; margin-top:12px; font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:17px; color:var(--cream2); letter-spacing:.2em; text-shadow:none; }
  /* 컨베이어 벨트 (붐 10/7): 오늘의 칵테일 → 파인앤코 QR → 크리켓 QR 카드가 오른쪽에서 왼쪽으로 천천히 지나간다.
     카드 3장을 두 번 이어 붙이고 트랙을 절반(-50%)만큼 옮기면 끊김 없이 돈다. 한 바퀴 80초(카드 5장, 속도는 3장 때와 같음). */
  #row{ position:absolute; left:28px; right:64px; top:512px; height:486px; overflow:hidden;   /* 세로 구분선(760)과 안쪽 테두리(1880) 안에서만 흐르게 */
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 70px, #000 calc(100% - 70px), transparent 100%); mask-image:linear-gradient(90deg, transparent 0, #000 70px, #000 calc(100% - 70px), transparent 100%); }
  #track{ position:absolute; left:0; top:4px; display:flex; gap:0; width:max-content; animation:belt 80s linear infinite; will-change:transform; }
  @keyframes belt{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }
  .card{ flex:0 0 auto; width:360px; height:462px; margin-right:70px; background:#f3e9c8; border:4px solid #000; box-shadow:0 0 0 4px #c89a3c, 10px 12px 0 rgba(0,0,0,.5); display:flex; flex-direction:column; align-items:center; padding:20px 16px 14px; box-sizing:border-box; font-family:'Press Start 2P',monospace; color:var(--ink); text-align:center; }
  .card .lbl{ font-size:10px; letter-spacing:.14em; color:#7a5a2a; }
  .card .lbl .ko{ display:block; margin-top:7px; font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:12px; letter-spacing:.3em; }
  .card .pic{ width:222px; height:222px; margin:8px 0 6px; background:center/contain no-repeat; image-rendering:pixelated; flex:0 0 auto; }
  .card .nm{ font-size:17px; line-height:1.3; color:#1a120b; text-shadow:none; }
  .card .tw{ margin-top:8px; display:inline-block; padding:5px 8px; background:#c89a3c; color:#1a130a; font-size:8px; letter-spacing:.03em; max-width:310px; }
  .card .ing{ margin-top:9px; font-family:'Cormorant Garamond',serif; font-size:18px; font-weight:500; line-height:1.3; color:#5a4020; max-width:320px; }
  /* QR 카드: 위에 이름 한 줄, 아래는 QR 만 (붐 10/7) */
  .card.qr{ justify-content:flex-start; }
  .card .lbl.big{ font-size:15px; letter-spacing:.12em; color:#1a120b; margin-top:8px; }
  .card .mark{ width:110px; height:74px; object-fit:contain; margin:8px 0 0; image-rendering:auto; }
  .card .mark.ig{ width:54px; height:54px; margin:10px 0 0; }
  .card .handle{ margin-top:6px; font-family:'Cormorant Garamond',serif; font-size:21px; font-weight:600; color:#5a4020; letter-spacing:.02em; }
  .card .handle + .qrbig{ margin-top:6px; width:250px; height:250px; }
  .card .qrbig{ width:270px; height:270px; margin:8px 0 0; background:center/contain no-repeat; image-rendering:pixelated; border:5px solid #1a120b; box-sizing:content-box; flex:0 0 auto; }

  /* 귀뚜라미 이스터에그: 오른쪽 칸 바닥을 뛰어다닌다 */
  #cricket{ position:absolute; left:0; top:0; width:44px; height:auto; image-rendering:auto; filter:drop-shadow(1px 2px 0 rgba(0,0,0,.6)); transform:translate(-50%,-100%); will-change:left,top,transform; }
  #contact{ position:absolute; right:60px; bottom:50px; font-size:18px; letter-spacing:.2em; color:var(--gold2); }
  #contact b{ font-weight:500; color:var(--gold); font-size:22px; letter-spacing:.14em; }
  #clock{ position:absolute; left:60px; bottom:50px; font-size:16px; letter-spacing:.14em; color:#8a7250; }

  /* ══ 세로 모니터(붐 가게: 26×47cm, 1080×1920) 레이아웃 ══
     화면이 세로이면(body.portrait) 위에서 아래로: 로고·QR·대기 → 가로 구분선 → Welcome → 벨트. 1080×1920 기준으로 그린다. */
  body.portrait #stage{ width:1080px; height:1920px; }
  body.portrait .vline{ left:120px; right:120px; top:1010px; bottom:auto; width:auto; height:1.5px; }
  body.portrait #left{ width:1080px; height:1000px; }
  body.portrait #logo{ top:64px; width:150px; height:267px; }
  body.portrait #scanto{ top:350px; left:160px; right:160px; }
  body.portrait #qr{ top:398px; width:400px; height:400px; }
  body.portrait #srw{ top:840px; }
  body.portrait #sub{ top:880px; }
  body.portrait #howmini{ top:942px; }
  body.portrait #wait{ top:978px; }
  body.portrait #right{ left:0; top:1020px; width:1080px; height:900px; }
  body.portrait #welcome{ top:40px; width:860px; height:292px; }
  body.portrait #hello{ top:338px; }
  body.portrait #row{ left:40px; right:40px; top:396px; height:410px; }
  body.portrait #track{ zoom:.84; }   /* 세로에선 카드를 16% 줄여 아래 연락처 자리를 남긴다 */
  body.portrait #contact{ right:60px; bottom:30px; font-size:16px; }
  body.portrait #contact b{ font-size:19px; }
  body.portrait #clock{ left:60px; bottom:30px; font-size:14px; }
</style>
</head>
<body>
<div id="stage">
  <div class="frame"></div><div class="frame2"></div><div class="vline"></div>

  <section id="left">
    <div id="logo"></div>
    <div class="rule" id="scanto"><i></i><span class="sp">Scan to Join</span><i></i></div>
    <div id="qr"></div>
    <div id="srw">SCAN · REGISTER · WAIT</div>
    <div id="sub">Scan the QR code to join our waiting list<br><span class="zh">扫码加入等候名单</span></div>
    <div id="howmini">Name &amp; phone → SMS when your table is ready → arrive within 10 min</div>
    <div id="wait" class="off"><span class="dot"></span><span id="waitTxt">WAITING LIST</span></div>
  </section>

  <section id="right">
    <div id="welcome" role="img" aria-label="Welcome to Pine & Co"></div>
    <div id="hello">WELCOME HOME, GUEST!<span class="ko">파인앤코에 오신 것을 환영합니다</span></div>
    <div id="row">
      <div id="track"></div>
    </div>
    <!-- 벨트에 올릴 카드 원본 3장 (JS 가 두 번 복제해 트랙에 깐다) -->
    <template id="cardTpl">
      <div class="card ck">
        <div class="lbl">TODAY'S COCKTAIL<span class="ko">오늘의 한 잔</span></div>
        <div class="pic ckPic"></div>
        <div class="nm ckName">—</div>
        <div class="tw ckTw"></div>
        <div class="ing ckIng"></div>
      </div>
      <div class="card qr">
        <div class="lbl big">PINE&amp;CO MENU</div>
        <img class="mark" src="front/bp_title_logo.png" alt="Bartender's Happy Hour">
        <div class="qrbig" style="background-image:url(front/qr_pine.png)"></div>
      </div>
      <div class="card qr">
        <div class="lbl big">CRICKET MENU</div>
        <img class="mark" src="front/cricket_mark.png" alt="Cricket Seoul">
        <div class="qrbig" style="background-image:url(front/qr_cricket.png)"></div>
      </div>
      <div class="card qr">
        <div class="lbl big">PINE&amp;CO INSTAGRAM</div>
        <img class="mark ig" src="front/ig_icon.png" alt="Instagram">
        <div class="handle">@pineandco_seoul</div>
        <div class="qrbig" style="background-image:url(front/qr_ig_pine.png)"></div>
      </div>
      <div class="card qr">
        <div class="lbl big">CRICKET INSTAGRAM</div>
        <img class="mark ig" src="front/ig_icon.png" alt="Instagram">
        <div class="handle">@cricket.seoul</div>
        <div class="qrbig" style="background-image:url(front/qr_ig_cricket.png)"></div>
      </div>
    </template>
    <img id="cricket" src="front/cricket_ch0.png" alt="">
  </section>

  <div id="clock"></div>
  <div id="contact">CONTACT <b>010 · 6817 · 0406</b></div>
</div>

<script>
/* ── 화면 맞춤: 1920×1080 을 어떤 모니터에도 비율 유지 ── */
/* 가로 화면이면 1920×1080, 세로 화면이면 1080×1920 디자인을 쓴다. ?rot=1 이면 윈도우가 가로인데 모니터만 세로로 세운 경우: 세로 디자인을 90° 돌려 꽉 채운다 */
const ROT=(location.search.match(/[?&]rot=(1|2)/)||[])[1]|0;   // 1 = 시계방향 90°, 2 = 반시계 90°
function fit(){ const st=document.getElementById('stage'); const portrait=ROT||innerHeight>innerWidth; document.body.classList.toggle('portrait',portrait);
  const W=portrait?1080:1920, H=portrait?1920:1080;
  const s=ROT?Math.min(innerWidth/H, innerHeight/W):Math.min(innerWidth/W, innerHeight/H);
  st.style.transform='translate(-50%,-50%) '+(ROT===1?'rotate(90deg) ':ROT===2?'rotate(-90deg) ':'')+'scale('+s+')'; st.style.transformOrigin='50% 50%'; }
addEventListener('resize',fit); fit();

/* ── 오늘의 칵테일: 날짜로 하나 고른다 (매일 바뀜, 같은 날엔 같은 잔) ── */
const COCKTAILS=[
  {"slug":"bingsu","name":"BINGSU","tw":"Twisted Frozen G&T","ing":"pine gin · tonic water · mandarin sorbet · lime"},
  {"slug":"nuruk","name":"NURUK","tw":"Twisted Whisky Highball","ing":"whisky · nuruk · genmai tea · koji · toasted barley"},
  {"slug":"americano","name":"AMERICANO","tw":"Twisted Americano","ing":"distilled coffee water · solomon syrup · campari · cacao vodka"},
  {"slug":"picnic","name":"PICNIC","tw":"Twisted Tom Collins","ing":"boiled egg · vodka · lactose · yuzu · lemon · gimbap · umami rice"},
  {"slug":"bulgogi","name":"BULGOGI","tw":"Twisted Paloma & Batanga","ing":"tequila · bulgogi · calamansi · grapefruit · cola syrup · tonic water"},
  {"slug":"hwachae","name":"HWACHAE","tw":"Twisted Punch","ing":"soju · omija · watermelon · soda"},
  {"slug":"gungoguma","name":"GUN-GOGUMA","tw":"Twisted Roasted Sweet Potato Latte","ing":"gamuchi soju · purple sweet potato · coconut · charcoal smoked cream"},
  {"slug":"aperolslush","name":"APEROL SLUSH","tw":"Twisted Aperol Spritz","ing":"aperol · sparkling wine · campari · orange · lemon zest"},
  {"slug":"kiwicolada","name":"KIWI COLADA","tw":"Twisted Piña Colada","ing":"white rum · korean mint · pistachio · kiwi · almond · coconut · green tea"},
  {"slug":"bloodymarysoup","name":"BLOODY MARY SOUP","tw":"Twisted Bloody Mary","ing":"moonbaesool · fresh tomato juice · lemon · olive gel · worcestershire gel · sesame oil · cardamom pepper oil · cucumber bubble · dill"},
  {"slug":"corn","name":"CORN","tw":"Twisted Margarita","ing":"tequila · mezcal · young corn · corn silk · lime · distilled tabasco"},
  {"slug":"banana","name":"BANANA","tw":"Twisted Daiquiri","ing":"rum · banana · lime · homemade black sesame meringue"},
  {"slug":"yogurt","name":"YOGURT","tw":"Twisted Kaikan Fizz","ing":"vodka · apricot · peach · homemade yogurt · lime · agave · lemongrass · kaffir lime"},
  {"slug":"hotbeer","name":"HOT BEER","tw":"Twisted Irish Coffee","ing":"rye whisky · peanut butter · soboro powder · coffee · Guinness · mango butter"},
  {"slug":"cacao","name":"CACAO","tw":"Twisted Old Fashioned","ing":"whisky · cacao bitters · lapsang souchong · port wine · chocolate · cacao nibs · baby choux"},
  {"slug":"passionfruit","name":"PASSIONFRUIT","tw":"Twisted Pornstar Martini","ing":"gin · vodka · passionfruit · lemon · yakju · vanilla"}
];
/* 영업일마다 무작위로 한 잔 (붐 10/7). 영업일(19:00~익일 02:00)을 씨앗으로 섞어서 같은 날엔 어느 화면이든 같은 잔, 다음 영업일엔 다른 잔(전날과 같은 잔은 피함) */
function bizDay(){ const d=new Date(); d.setHours(d.getHours()-19);   // 영업일 = 오후 7시 개점 ~ 새벽 2시 마감. 7시에 새 날, 새벽 2시까지는 같은 날
  return Math.floor((d.getTime()+9*3600e3)/864e5); }
function seeded(n){ let x=Math.imul(n,2654435761)>>>0; x^=x>>>15; x=Math.imul(x,2246822519)>>>0; x^=x>>>13; x=Math.imul(x,3266489917)>>>0; x^=x>>>16; return x>>>0; }
function pickFor(day){ return seeded(day)%COCKTAILS.length; }
function dayIndex(){ const day=bizDay(); let i=pickFor(day); if(i===pickFor(day-1)) i=(i+1)%COCKTAILS.length; return i; }
/* 벨트 트랙: 카드 3장을 두 벌 깐다(끊김 없는 순환용) */
(function(){ const track=document.getElementById('track'), tpl=document.getElementById('cardTpl'); for(let k=0;k<2;k++) track.appendChild(tpl.content.cloneNode(true)); })();
function showCocktail(){ const c=COCKTAILS[dayIndex()];
  document.querySelectorAll('.ckPic').forEach(e=>e.style.backgroundImage='url(front/photo_'+c.slug+'.png)');
  document.querySelectorAll('.ckName').forEach(e=>e.textContent=c.name); document.querySelectorAll('.ckTw').forEach(e=>e.textContent=c.tw); document.querySelectorAll('.ckIng').forEach(e=>e.textContent=c.ing); }
showCocktail(); setInterval(showCocktail, 60e3);

/* ── 실시간 대기 (같은 서버의 /api/stream, 끊기면 /api/queue 폴링) ── */
const waitEl=document.getElementById('wait'), waitTxt=document.getElementById('waitTxt');
function paintWait(q){ if(!Array.isArray(q)){ waitEl.classList.add('off'); waitTxt.textContent='WAITING LIST'; return; }
  const n=q.filter(x=>x&&x.status==='waiting').length; waitEl.classList.remove('off');
  waitTxt.innerHTML = n===0 ? 'NO WAIT · <b>walk right in</b> · 바로 입장' : 'NOW WAITING <b>'+n+'</b> '+(n===1?'team':'teams')+' · 대기 <b>'+n+'</b>팀'; }
function pollQueue(){ fetch('/api/queue',{cache:'no-store'}).then(r=>r.json()).then(paintWait).catch(()=>paintWait(null)); }
(function sse(){ let es; try{ es=new EventSource('/api/stream'); }catch(e){ pollQueue(); setInterval(pollQueue,20e3); return; }
  let gotAny=false; es.onmessage=e=>{ try{ const d=JSON.parse(e.data); gotAny=true; paintWait(Array.isArray(d)?d:d.queue); }catch(_){} };
  es.onerror=()=>{ if(!gotAny) pollQueue(); };
  setInterval(pollQueue, 30e3);   // 보험: 30초마다 한 번 더 맞춘다
})();

/* ── 귀뚜라미 이스터에그: 오른쪽 칸 바닥선을 따라 무작위로 뛰어다닌다 ── */
(function(){ const el=document.getElementById('cricket'); const P=document.body.classList.contains('portrait'); const GROUND=P?878:1004; const SPOTS=P?[120,300,480,660,840,980]:[150,330,520,700,880,1020]; let cur=2, ci=0;
  const HEAD_RIGHT=i=>i===3; const place=(x,y,f)=>{ el.style.left=x+'px'; el.style.top=y+'px'; el.style.transform='translate(-50%,-100%) scaleX('+f+')'; };
  function pick(){ let n; do{ n=Math.floor(Math.random()*5); }while(n===ci); ci=n; el.src='front/cricket_ch'+ci+'.png'; }
  function hop(){ let nx; do{ nx=Math.floor(Math.random()*SPOTS.length); }while(nx===cur); const x0=SPOTS[cur], x1=SPOTS[nx]; const goR=x1>x0; const f=(goR===HEAD_RIGHT(ci))?1:-1;
    const dur=600+Math.random()*300, arc=60+Math.random()*50, t0=performance.now();
    (function fr(now){ const p=Math.min(1,(now-t0)/dur); place(x0+(x1-x0)*p, GROUND-arc*4*p*(1-p), f); if(p<1) requestAnimationFrame(fr); else { cur=nx; pick(); place(x1,GROUND,(goR===HEAD_RIGHT(ci))?1:-1); setTimeout(hop, 1500+Math.random()*4000); } })(t0); }
  place(SPOTS[cur],GROUND,-1); setTimeout(hop,2500); })();

/* ── 시계 + 새벽 5시 자동 새로고침(업데이트 반영) ── */
function tick(){ const d=new Date(); document.getElementById('clock').textContent=d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'}).toUpperCase()+' · '+d.toTimeString().slice(0,5); if(d.getHours()===5&&d.getMinutes()===0&&d.getSeconds()<2) location.reload(); }
tick(); setInterval(tick,1000);

/* ── 마우스 커서 자동 숨김: 움직이면 보이고 3초 멈추면 숨김 ── */
(function(){ let t=0; const idle=()=>document.body.classList.add('idle'); addEventListener('mousemove',()=>{ document.body.classList.remove('idle'); clearTimeout(t); t=setTimeout(idle,3000); }); t=setTimeout(idle,3000); })();
</script>
</body>
</html>
