<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Pine &amp; Co — Cocktail Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet"/>
<style>
:root{--pf:'Press Start 2P',monospace;--df:'DotGothic16','Press Start 2P',monospace;--ink:#1e1208;--ink2:#2a1a0e;--cream:#f0ebe0;--gold:#b8935a;--amber:#c9a96e;--muted:#7a6550;--ok:#5DCAA5;--fail:#c07070;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;}
body{font-family:var(--df);background:var(--ink);color:var(--cream);min-height:100vh;min-height:100dvh;overflow-x:hidden;display:flex;flex-direction:column;}
.hdr{text-align:center;padding:20px 16px 8px;}
.hdr-logo{font-family:var(--pf);font-size:10px;letter-spacing:.35em;color:var(--gold);}
.hdr-t{font-family:var(--pf);font-size:24px;font-weight:300;color:var(--cream);margin-top:1px;}

#app{flex:1;display:flex;flex-direction:column;}

/* Progress */
.prog{display:flex;gap:6px;justify-content:center;margin:8px 0;}
.pd{width:9px;height:9px;border-radius:50%;background:rgba(184,147,90,.12);}
.pd.ok{background:var(--ok);}.pd.no{background:var(--fail);}.pd.now{background:var(--gold);box-shadow:0 0 8px rgba(184,147,90,.35);}

/* Game area */
.gm{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 14px 20px;max-width:500px;margin:0 auto;width:100%;}
.tgt{text-align:center;margin-bottom:8px;}
.tgt-l{font-size:8px;color:var(--muted);letter-spacing:.18em;font-family:var(--pf);}
.tgt-n{font-family:var(--pf);font-size:15px;color:var(--gold);margin-top:8px;line-height:1.5;}
.glasses{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px;}
.gl{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px 6px;border:1px solid rgba(184,147,90,.14);border-radius:10px;background:rgba(240,235,224,.025);width:98px;cursor:pointer;touch-action:manipulation;transition:all .12s;}
.gl:active{transform:scale(.93);}
.gl img{height:64px;}
.gl.bad{opacity:.3;}
.anim-zone{height:230px;display:flex;align-items:flex-end;justify-content:center;margin:6px 0 10px;}
.anim-zone img{height:220px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5));}
.tgt-pic{height:118px;display:flex;align-items:flex-end;justify-content:center;margin-top:4px;}
.tgt-pic img{height:118px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5));animation:gd .4s ease-out both;}
.step{font-family:var(--pf);font-size:7px;letter-spacing:.2em;color:var(--muted);margin-bottom:6px;}
.step b{color:var(--gold);font-weight:400;}

/* Tray (selected ingredients) */
.tray{display:flex;align-items:center;gap:6px;min-height:34px;padding:6px 14px;border:1px solid rgba(184,147,90,.2);border-radius:30px;background:rgba(184,147,90,.05);margin:0 auto 12px;}
.tray-d{width:12px;height:12px;border-radius:50%;animation:drop .2s ease-out;}
.tray-c{font-size:8px;color:var(--muted);font-family:var(--pf);letter-spacing:.08em;margin-left:4px;}

/* Pixel art assets */
.px{image-rendering:auto;display:block;}
/* Shaker */
.sk-zone{position:relative;width:140px;height:170px;margin:0 auto 10px;display:flex;align-items:flex-end;justify-content:center;}
.sk{height:160px;cursor:pointer;transition:filter .12s;filter:drop-shadow(0 0 14px rgba(93,202,165,.18));}
.sk.shk{animation:shk .07s infinite alternate;}
@keyframes shk{0%{transform:rotate(-6deg) translateY(-3px);}100%{transform:rotate(6deg) translateY(3px);}}
@keyframes drop{0%{transform:translateY(-12px) scale(.5);opacity:0;}100%{transform:translateY(0) scale(1);opacity:1;}}

/* Mixing glass (stir) */
.stir-zone{position:relative;width:220px;height:220px;margin:0 auto 6px;touch-action:none;cursor:grab;display:flex;align-items:center;justify-content:center;}
.mg{height:176px;pointer-events:none;transition:transform .08s linear;transform-origin:50% 85%;}
.swirl{position:absolute;left:50%;top:50%;width:200px;height:200px;border-radius:50%;border:1px dashed rgba(184,147,90,.25);transform:translate(-50%,-50%);}
.stir-zone.on .swirl{border-color:rgba(93,202,165,.5);}
.stir-dot{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;background:var(--amber);margin:-7px 0 0 -7px;box-shadow:0 0 10px rgba(201,169,110,.6);pointer-events:none;}

/* Build glass */
.bd-zone{position:relative;height:180px;margin:0 auto 6px;display:flex;align-items:flex-end;justify-content:center;}
.bd-wrap{position:relative;display:inline-block;}
.bd-img{height:100%;position:relative;z-index:1;}
.bd{position:absolute;display:flex;flex-direction:column-reverse;z-index:2;mix-blend-mode:multiply;overflow:hidden;}
.bd .ly{width:100%;animation:pourin .5s ease-out;opacity:.85;}
@keyframes pourin{0%{height:0;}100%{height:var(--h);}}
.bd-list{display:flex;flex-direction:column;gap:4px;align-items:center;margin-bottom:10px;}
.bd-it{font-size:13px;color:var(--muted);letter-spacing:.04em;}
.bd-it.done{color:var(--ok);}.bd-it.next{color:var(--gold);}

.hint{text-align:center;margin-bottom:10px;font-size:15px;color:var(--amber);}
.hint .p{animation:pls 1.2s ease-in-out infinite;}
@keyframes pls{0%,100%{opacity:.35;}50%{opacity:1;}}
.sbar{width:180px;height:7px;border-radius:4px;background:rgba(184,147,90,.1);margin:6px auto 0;overflow:hidden;}
.sfill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--ok));transition:width .1s;}

/* Method choice */
.meths{display:flex;gap:10px;justify-content:center;width:100%;margin:6px 0 10px;}
.mt{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px 12px;
  border:1px solid rgba(184,147,90,.2);border-radius:12px;background:rgba(240,235,224,.03);cursor:pointer;transition:all .12s;touch-action:manipulation;}
.mt:active{transform:scale(.95);border-color:var(--gold);}
.mt img{height:72px;}
.mt-n{font-family:var(--pf);font-size:9px;letter-spacing:.14em;color:var(--gold);}
.mt-s{font-size:12px;color:var(--muted);text-align:center;line-height:1.3;}
.meth-note{font-size:13px;color:var(--muted);text-align:center;line-height:1.6;max-width:300px;margin-bottom:6px;}

/* Retry banner */
.retry-ban{text-align:center;padding:14px;margin-bottom:10px;border:1px solid rgba(192,112,112,.3);border-radius:10px;background:rgba(192,112,112,.06);}
.retry-ban .t{color:var(--fail);font-family:var(--pf);font-size:9px;line-height:1.6;margin-bottom:4px;}
.retry-ban .s{color:var(--muted);font-size:13px;line-height:1.5;}
.retry-wrong{color:var(--fail);font-size:13px;}.retry-right{color:var(--ok);font-size:13px;}

/* Ingredients grid */
.ing-l{font-family:var(--pf);font-size:8px;letter-spacing:.14em;color:var(--muted);margin-bottom:8px;text-align:center;}
.ings{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px;}
.ig{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px 6px;
  border:1px solid rgba(184,147,90,.14);border-radius:10px;background:rgba(240,235,224,.025);
  cursor:pointer;transition:all .12s;touch-action:manipulation;width:72px;}
.ig:active{transform:scale(.93);}
.ig.sel{border-color:var(--gold);background:rgba(184,147,90,.12);}
.ig img{width:44px;height:50px;object-fit:contain;}
.ig-n{font-size:11px;color:var(--cream);text-align:center;line-height:1.15;min-height:20px;display:flex;align-items:center;}

/* Buttons */
.btn{padding:14px 24px;border:none;border-radius:8px;cursor:pointer;font-family:var(--pf);font-size:10px;line-height:1.6;letter-spacing:.1em;font-weight:500;background:linear-gradient(135deg,var(--gold),var(--amber));color:var(--ink);transition:opacity .2s;}
.btn:hover{opacity:.9;}
.btn:disabled{opacity:.35;cursor:default;}
.btn2{background:none;border:1px solid rgba(184,147,90,.2);color:var(--muted);font-size:8px;padding:10px 18px;margin-top:8px;border-radius:8px;cursor:pointer;font-family:var(--pf);letter-spacing:.08em;}

/* Result */
.res{position:fixed;inset:0;background:rgba(30,18,8,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:50;animation:fi .4s;overflow-y:auto;}
@keyframes fi{0%{opacity:0;}100%{opacity:1;}}
.res-name{font-family:var(--pf);font-size:14px;line-height:1.5;color:var(--gold);margin-bottom:4px;}
.res-sub{font-size:15px;color:var(--cream);margin-bottom:6px;}
.res-meth{display:inline-block;font-family:var(--pf);font-size:7px;letter-spacing:.2em;padding:5px 12px;border-radius:20px;border:1px solid rgba(184,147,90,.35);color:var(--gold);margin-bottom:8px;}
.res-meth.bad{border-color:var(--fail);color:var(--fail);}
.res-why{font-size:14px;color:var(--cream);text-align:center;line-height:1.6;max-width:310px;margin-bottom:8px;}
.res-why.bad{color:var(--fail);}
.res-ing{font-size:13px;color:var(--amber);margin-bottom:10px;text-align:center;line-height:2;}
.res-fact{font-size:13px;color:var(--muted);text-align:center;line-height:1.7;max-width:310px;margin-bottom:16px;padding:12px 16px;border-left:2px solid rgba(184,147,90,.2);}

/* Result picture */
.res-pic{height:190px;margin-bottom:12px;display:flex;align-items:flex-end;justify-content:center;}
.res-pic img{height:190px;animation:gd .5s ease-out both;}
.res-pic.dim img{filter:grayscale(.9) brightness(.45);}
/* Glass visuals (legacy fallback) */
.gl-w{position:relative;width:120px;height:160px;margin-bottom:12px;}
.gl-martini{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:76px;height:64px;overflow:hidden;}
.gl-martini::after{content:'';position:absolute;inset:0;border-left:2px solid rgba(240,235,224,.22);border-right:2px solid rgba(240,235,224,.22);border-bottom:2px solid rgba(240,235,224,.22);clip-path:polygon(0 0,100% 0,62% 100%,38% 100%);}
.gl-martini .lq{position:absolute;bottom:0;left:18%;right:18%;clip-path:polygon(0 0,100% 0,78% 100%,22% 100%);animation:fu .8s ease-out forwards;}
.gl-high{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:48px;height:96px;border:2px solid rgba(240,235,224,.22);border-radius:3px 3px 8px 8px;overflow:hidden;}
.gl-high .lq{position:absolute;bottom:0;width:100%;border-radius:0 0 6px 6px;animation:fu .8s ease-out forwards;}
.gl-coupe{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:72px;height:56px;border:2px solid rgba(240,235,224,.22);border-radius:0 0 50% 50%;overflow:hidden;}
.gl-coupe .lq{position:absolute;bottom:0;width:100%;border-radius:0 0 50% 50%;animation:fu .8s ease-out forwards;}
.gl-wine{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:68px;height:78px;border:2px solid rgba(240,235,224,.22);border-radius:8px 8px 50% 50%;overflow:hidden;}
.gl-wine .lq{position:absolute;bottom:0;width:100%;border-radius:0 0 50% 50%;animation:fu .8s ease-out forwards;}
.gl-rocks{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:58px;height:56px;border:2px solid rgba(240,235,224,.22);border-radius:2px 2px 6px 6px;overflow:hidden;}
.gl-rocks .lq{position:absolute;bottom:0;width:100%;border-radius:0 0 4px 4px;animation:fu .8s ease-out forwards;}
.gl-stem{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:3px;height:20px;background:rgba(240,235,224,.13);}
.gl-base{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:32px;height:4px;background:rgba(240,235,224,.15);border-radius:2px;}
.gl-gar{position:absolute;top:8px;right:6px;font-size:20px;animation:gd .4s ease-out .6s both;}
@keyframes gd{0%{transform:translateY(-14px) rotate(-20deg);opacity:0;}100%{transform:translateY(0);opacity:1;}}
.gl-ice{position:absolute;font-size:12px;opacity:.45;animation:ifl 2s ease-in-out infinite alternate;}
@keyframes ifl{0%{transform:translateY(0);}100%{transform:translateY(-3px);}}
@keyframes fu{0%{height:0;}100%{height:var(--h,75%);}}

/* Pine & Co bar background (pixel art of the real bar) */
#bg{position:fixed;inset:0;z-index:-1;background:var(--ink) url(lab/ui_bg.webp) center top/cover no-repeat;image-rendering:auto;transition:opacity .4s;}
#bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,18,8,.1) 0%,rgba(30,18,8,.3) 45%,rgba(30,18,8,.85) 100%);}
body.play #bg{opacity:.2;}
body.play .tgt-n,body.play .tgt-l,body.play .step,body.play .ing-l{text-shadow:0 2px 6px rgba(0,0,0,.9),0 0 2px #000;}
/* Game logo on top during play (like the party mini games) */
.hdr{padding:12px 16px 4px;}
#gameLogo{display:block;max-height:76px;width:auto;max-width:80vw;margin:0 auto;filter:drop-shadow(0 4px 0 rgba(0,0,0,.55));}
body.intro .hdr{visibility:hidden;}

/* HOW TO PLAY overlay (same flow as the Pine & Co party mini games) */
#howto{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.68);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;cursor:pointer;}
#howto.hidden{display:none;}
#htWords{width:min(330px,86vw);}
.htw{display:block;width:100%;image-rendering:pixelated;opacity:0;transform:translateY(-70vh);filter:drop-shadow(0 4px 0 rgba(0,0,0,.5));}
.htw#htTo,.htw#htPlay{margin-top:-6.9%;}
.htw.land{opacity:1;transform:translateY(0);transition:transform .24s cubic-bezier(.34,1.45,.5,1),opacity .08s linear;}
.htw.hit{animation:htwHit .2s ease-out;}
@keyframes htwHit{0%{transform:translateY(0) scale(1.12,.88);}55%{transform:translateY(0) scale(.97,1.05);}100%{transform:translateY(0) scale(1,1);}}
.ht-panel{background:rgba(0,0,0,.74);border:3px solid rgba(255,255,255,.18);border-radius:10px;padding:18px 16px;max-width:340px;font-family:'Press Start 2P',monospace;}
.ht-name{font-size:12px;color:#e6b450;margin-bottom:12px;letter-spacing:1px;}
.ht-desc{font-size:10px;color:#fff;line-height:1.9;}
.ht-li{text-align:left;margin:0 0 7px;line-height:1.65;}
.ht-taunt{margin-top:15px;font-size:1.4em;color:#ffd977;text-shadow:2px 2px 0 #000;line-height:1.5;}
.ht-tap{font-size:10px;color:#6fcf8f;margin-top:14px;animation:htblink 1s step-end infinite;}
@keyframes htblink{50%{opacity:.25;}}

/* Intro & Final */
.intro,.final{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;}
.intro{padding-top:18px;justify-content:flex-start;}
.intro-e{font-size:56px;margin-bottom:12px;}
.intro-e img{height:150px;}
.intro-t{font-family:var(--pf);font-size:30px;color:var(--gold);margin-bottom:6px;}
.intro-s{font-size:14px;color:var(--muted);line-height:1.8;max-width:300px;margin-bottom:24px;}
.intro-m{display:flex;gap:14px;justify-content:center;margin:4px 0 16px;}
.intro-m span{font-family:var(--pf);font-size:10px;letter-spacing:.14em;color:var(--gold);border:1px solid rgba(184,147,90,.3);border-radius:20px;padding:5px 11px;}
.f-score{font-family:var(--pf);font-size:40px;margin:8px 0;color:var(--gold);}
.f-label{font-family:var(--pf);font-size:8px;letter-spacing:.22em;color:var(--muted);}
.f-msg{font-size:15px;color:var(--cream);margin-top:14px;line-height:1.7;max-width:300px;}
.f-box{margin-top:16px;padding:18px 22px;border:1.5px solid var(--ok);border-radius:12px;background:rgba(93,202,165,.05);max-width:310px;}
.f-box .bt{font-family:var(--pf);font-size:9px;color:var(--ok);letter-spacing:.1em;margin-bottom:8px;}
.f-box .bs{font-size:14px;color:var(--cream);line-height:1.7;}

/* Floating check-turn button */
.check-btn{position:fixed;bottom:20px;right:20px;z-index:40;padding:12px 18px;
  border:1px solid rgba(184,147,90,.3);border-radius:50px;background:rgba(30,18,8,.9);
  color:var(--gold);font-family:var(--pf);font-size:8px;letter-spacing:.08em;
  cursor:pointer;backdrop-filter:blur(8px);transition:all .15s;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.check-btn:active{transform:scale(.95);}

/* Turn overlay */
.turn-overlay{position:fixed;inset:0;background:rgba(30,18,8,.95);z-index:60;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px;animation:fi .3s;}
.turn-num{font-family:var(--pf);font-size:44px;color:var(--gold);line-height:1;}
.turn-label{font-family:var(--pf);font-size:8px;letter-spacing:.2em;color:var(--amber);margin-top:4px;}
.turn-pos{font-size:18px;color:var(--cream);margin-top:16px;}
.turn-pos strong{color:var(--gold);font-family:var(--pf);font-size:16px;}
.turn-total{font-size:14px;color:var(--muted);margin-top:4px;}
.turn-close{margin-top:24px;padding:12px 28px;border:1px solid rgba(184,147,90,.3);border-radius:8px;
  background:rgba(184,147,90,.08);color:var(--gold);font-family:var(--pf);font-size:9px;
  letter-spacing:.1em;cursor:pointer;}
</style>
</head>
<body class="intro">
<div id="bg"></div>
<div class="hdr"><img id="gameLogo" class="px" src="lab/ui_title.webp" alt="Cocktail Lab" draggable="false"></div>
<div id="app"></div>
<div id="howto">
  <div id="htWords">
    <img class="htw" id="htHow" src="lab/hp_how.webp" alt="HOW">
    <img class="htw" id="htTo" src="lab/hp_to.webp" alt="TO">
    <img class="htw" id="htPlay" src="lab/hp_play.webp" alt="PLAY">
  </div>
  <div class="ht-panel">
    <div class="ht-name">COCKTAIL LAB</div>
    <div class="ht-desc">
      <div class="ht-li">- Pick the right glass, then the right ingredients.</div>
      <div class="ht-li">- Choose the technique: SHAKE, STIR or BUILD. Wrong one ruins the drink.</div>
      <div class="ht-li">- Shake your phone, stir in circles, or pour in order.</div>
      <div class="ht-taunt">5 classics. Nail them all.</div>
    </div>
    <div class="ht-tap">TAP TO START!</div>
  </div>
</div>
<div id="turn-overlay" style="display:none;"></div>
<button class="check-btn" id="check-btn" onclick="checkTurn()" style="display:none;">📋 MY TURN</button>
<script>
/* ═══ SVG ICON FACTORY ═══ */
function svgBottle(body,neck,cap,fill,accent,shine){
  return `<svg viewBox="0 0 36 46" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="13" y="2" width="10" height="6" rx="2" fill="${cap}"/>
    <rect x="14.5" y="7" width="7" height="${neck}" rx="2" fill="${accent}"/>
    <rect x="${body[0]}" y="${body[1]}" width="${body[2]}" height="${body[3]}" rx="${body[4]}" fill="${fill}"/>
    ${shine?`<rect x="${body[0]+3}" y="${body[1]+3}" width="3" height="${body[3]-10}" rx="1.5" fill="rgba(255,255,255,.12)"/>`:''}
    ${accent!==fill?`<rect x="${body[0]}" y="${body[1]+body[3]-8}" width="${body[2]}" height="8" rx="2" fill="${accent}" opacity=".3"/>`:''}
  </svg>`;
}
const IC={
  // Spirits — each a distinct bottle shape
  'White Rum':     ()=>svgBottle([8,14,20,30,3],8,'#d4a44a','#f5e6c8','#c8a050',true),
  'Aged Rum':      ()=>svgBottle([8,14,20,30,3],8,'#8b5e2b','#a06830','#6b3e18',true),
  'Vodka':         ()=>svgBottle([10,12,16,32,2],6,'#a8b8c8','#d8e4f0','#8898a8',true),
  'Citrus Vodka':  ()=>svgBottle([10,12,16,32,2],6,'#c8c848','#e8e8b8','#a8a838',true),

const ALL_N=Object.keys(IC);
const MLABEL={shake:'SHAKEN',stir:'STIRRED',build:'BUILT IN THE GLASS'};
let st='intro',ci=0,sc=0,rr=[],sel=[],co=[],shk=0,retryMsg=null,glassMsg=null,roundIngs=[],chosen=null,failWhy=null,stirAng=0,lastA=null,poured=0;
const TOT=5,SHKNEED=14,STIRNEED=6*Math.PI; // 3 full turns of the bar spoon
const GLASSES=[{id:'highball',n:'Highball'},{id:'rocks',n:'Rocks'},{id:'coupe',n:'Coupe'},{id:'martini',n:'Martini'},{id:'wine',n:'Wine glass'},{id:'mug',n:'Copper mug'}];

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function start(){co=shuffle(CK).slice(0,TOT);ci=0;sc=0;rr=[];round();}
function round(){
  sel=[];shk=0;retryMsg=null;glassMsg=null;failWhy=null;chosen=null;st='glass';
  // Set ingredients once per cocktail, keep on retry
  const c=cur();
  const decoys=shuffle(ALL_N.filter(n=>!c.ing.includes(n))).slice(0,Math.max(5,10-c.ing.length));
  roundIngs=shuffle([...c.ing,...decoys]);
  render();
}
function cur(){return co[ci];}
function methodsOf(c){return c.alt?[c.m,c.alt]:[c.m];}
function glassesOf(c){return c.galt?[c.glass,c.galt]:[c.glass];}
function vib(p){if(navigator.vibrate)navigator.vibrate(p);}

/* Step 1: glass (forgiving: a wrong glass just gets a nudge and another pick) */
function pickGlass(g){
  if(st!=='glass')return;
  const c=cur();
  if(glassesOf(c).includes(g)){glassMsg=null;vib(20);st='playing';render();return;}
  glassMsg=g;vib([60,30,60]);render();
}

/* Step 2: ingredients */
function tap(name){
  if(st!=='playing')return;
  if(retryMsg&&sel.length===0)retryMsg=null; // clear hint on first new selection
  if(sel.includes(name)){sel=sel.filter(s=>s!==name);render();return;}
  const c=cur();
  if(sel.length>=c.ing.length)return; // max reached
  sel.push(name);
  vib(20);
  if(sel.length===c.ing.length)st='method';
  render();
}
function backToIngs(){if(st!=='method')return;st='playing';render();}

/* Step 3: technique. Ingredients are judged first (retry with hint), then the technique (strict) */
function chooseMethod(m){
  if(st!=='method')return;
  const c=cur();
  const correct=sel.length===c.ing.length&&c.ing.every(i=>sel.includes(i));
  if(!correct){
    const right=sel.filter(s=>c.ing.includes(s));
    const wrong=sel.filter(s=>!c.ing.includes(s));
    retryMsg={right,wrong,hint:c.hint||'Think about what makes this cocktail unique.'};
    st='playing';sel=[];vib([60,30,60,30,60]);render();return;
  }
  if(!methodsOf(c).includes(m)){
    failWhy=failText(c,m);rr.push('no');st='result';vib([60,30,60,30,60]);render();return;
  }
  chosen=m;st='mixing';shk=0;stirAng=0;lastA=null;poured=0;render();
  if(m==='stir')bindStir();
}
function failText(c,m){
  const n=c.name;
  if(c.m==='stir')return m==='shake'
    ?`Shaking clouds an all-spirit drink with ice shards and air. ${n} is stirred with ice in a mixing glass.`
    :`Left in the serving glass it never chills and dilutes properly. ${n} is stirred with ice in a mixing glass and strained.`;
  if(c.m==='shake')return m==='stir'
    ?`Stirring can't blend juice, egg or cream into the spirit. ${n} needs a hard shake with ice.`
    :`Citrus and syrup won't integrate just sitting in the glass. ${n} needs a hard shake with ice.`;
  return m==='shake'
    ?`Shaking soda or sparkling wine knocks out the bubbles. ${n} is built straight in the serving glass.`
    :`No mixing glass needed. ${n} is built straight in the serving glass over ice.`;
}

function finishMix(){
  if(st!=='mixing')return;
  sc++;rr.push('ok');st='result';failWhy=null;vib([80,40,80,40,160]);render();
}

/* SHAKE */
function doShake(){
  if(st!=='mixing'||chosen!=='shake')return;shk++;
  vib(12);
  const s=document.querySelector('.sk');
  if(s){s.classList.add('shk');setTimeout(()=>s.classList.remove('shk'),80);}
  const f=document.getElementById('mixFill');if(f)f.style.width=Math.min(100,Math.round(shk/SHKNEED*100))+'%';
  if(shk>=SHKNEED)finishMix();
}
function manShake(){if(st==='mixing'&&chosen==='shake'){shk++;doShake();}}

/* STIR: drag in circles around the mixing glass (or tap it) */
function stirProgress(){const f=document.getElementById('mixFill');if(f)f.style.width=Math.min(100,Math.round(stirAng/STIRNEED*100))+'%';}
function bindStir(){
  const z=document.getElementById('stirZone');if(!z)return;
  const sp=document.getElementById('spoon');
  const ang=e=>{const r=z.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));};
  let down=false,moved=0;
  z.addEventListener('pointerdown',e=>{down=true;moved=0;lastA=ang(e);z.classList.add('on');try{z.setPointerCapture(e.pointerId);}catch{}e.preventDefault();});
  z.addEventListener('pointermove',e=>{
    if(!down||st!=='mixing'||chosen!=='stir')return;
    const a=ang(e);let d=a-lastA;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;lastA=a;
    if(Math.abs(d)<0.9){stirAng+=Math.abs(d);moved+=Math.abs(d);}
    orbit(a);
    stirProgress();
    if(moved>Math.PI&&Date.now()-lastVib>400){lastVib=Date.now();vib(8);}
    if(stirAng>=STIRNEED){down=false;z.classList.remove('on');finishMix();}
  });
  const up=()=>{if(!down)return;down=false;z.classList.remove('on');lastA=null;if(moved<0.3)tapStir();};
  z.addEventListener('pointerup',up);z.addEventListener('pointercancel',up);
}
let lastVib=0;
function orbit(a){
  const sp=document.getElementById('spoon');if(sp)sp.style.transform=`translate(${(Math.cos(a)*80).toFixed(1)}px,${(Math.sin(a)*80).toFixed(1)}px)`;
  const mg=document.querySelector('.mg');if(mg)mg.style.transform=`rotate(${(Math.cos(a)*5).toFixed(1)}deg)`;
}
function tapStir(){
  if(st!=='mixing'||chosen!=='stir')return;
  stirAng+=Math.PI/2;vib(10);stirProgress();orbit(stirAng);
  if(stirAng>=STIRNEED)finishMix();
}

/* BUILD: pour each ingredient, in order, straight into the glass */
function pour(){
  if(st!=='mixing'||chosen!=='build')return;
  const c=cur();if(poured>=c.ing.length)return;
  poured++;vib(15);render();
  if(poured>=c.ing.length)setTimeout(finishMix,800);
}

function skip(){rr.push('no');failWhy=null;st='result';render();}
function next(){ci++;if(ci>=TOT){st='final';render();}else round();}

let la={x:0,y:0,z:0},lt=0;
function hm(e){const a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;const d=Math.abs(a.x-la.x)+Math.abs(a.y-la.y)+Math.abs(a.z-la.z);la={x:a.x,y:a.y,z:a.z};if(d>25&&Date.now()-lt>80){lt=Date.now();doShake();}}
async function reqM(){if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){try{const p=await DeviceMotionEvent.requestPermission();if(p==='granted')window.addEventListener('devicemotion',hm);}catch{}}else if(typeof DeviceMotionEvent!=='undefined')window.addEventListener('devicemotion',hm);}

        coupe:{h:150,css:'left:8%;right:8%;bottom:57%;height:30%;border-radius:0 0 50% 50%;'},
        martini:{h:150,css:'left:9%;right:9%;bottom:52%;height:40%;clip-path:polygon(0 0,100% 0,53% 100%,47% 100%);'},
        wine:{h:170,css:'left:12%;right:12%;bottom:44%;height:50%;border-radius:12px 12px 50% 50%;'}}[c.glass]||{h:170,css:'left:10%;right:10%;bottom:7%;height:84%;'};
      body=`<div class="bd-zone">
        <div class="bd-wrap" style="height:${GEO.h}px">
          ${pic('glass-'+(['highball','rocks','coupe','martini','wine'].includes(c.glass)?c.glass:'highball'),'bd-img')}
          <div class="bd" style="${GEO.css}">${lay}</div>
        </div>
      </div>
      <div class="bd-list">${c.ing.map((i,k)=>`<div class="bd-it ${k<poured?'done':k===poured?'next':''}">${k<poured?'✓ ':''}${i}</div>`).join('')}</div>
      <div class="hint"><span style="font-size:11px;color:var(--muted);">straight into the ice-filled glass, in order</span></div>
      <button class="btn" onclick="pour()" ${poured>=n?'disabled':''}>${poured>=n?'SERVED ✓':'POUR '+c.ing[poured].toUpperCase()}</button>`;
    }
    app.innerHTML=`<div class="gm">${head(4,{shake:'SHAKE',stir:'STIR',build:'BUILD'}[chosen])}${body}</div>`;
    return;
  }

  // ── Step 3: choose the technique ──
  if(st==='method'){
    app.innerHTML=`<div class="gm">${head(3,'TECHNIQUE')}
      <div class="tray">${sel.map(n=>`<div class="tray-d" style="background:${LC[n]||c.color};"></div>`).join('')}<span class="tray-c">${sel.length} / ${c.ing.length}</span></div>
      <div class="ing-l">HOW DO YOU MIX IT?</div>
      <div class="meths">
        <div class="mt" onclick="chooseMethod('shake')">${pic('tool-shake')}<div class="mt-n">SHAKE</div><div class="mt-s">shaker,<br>hard and fast</div></div>
        <div class="mt" onclick="chooseMethod('stir')">${pic('tool-stir')}<div class="mt-n">STIR</div><div class="mt-s">mixing glass,<br>bar spoon</div></div>
        <div class="mt" onclick="chooseMethod('build')">${pic('tool-build')}<div class="mt-n">BUILD</div><div class="mt-s">straight in<br>the glass</div></div>
      </div>
      <div class="meth-note">Choose carefully: the wrong technique ruins the drink.</div>
      <button class="btn2" onclick="backToIngs()">← CHANGE INGREDIENTS</button>
    </div>`;
    return;
  }

  // ── Step 1: glass ──
  if(st==='glass'){
    const gname=id=>(GLASSES.find(g=>g.id===id)||{}).n||id;
    app.innerHTML=`<div class="gm">${head(1,'GLASS')}
      ${glassMsg?`<div class="retry-ban"><div class="t">Not the ${gname(glassMsg)}!</div><div class="s">Think about how it is served: straight up, on the rocks, or long with ice.</div></div>`:''}
      <div class="ing-l">WHICH GLASS?</div>
      <div class="glasses">
        ${GLASSES.map(g=>`<div class="gl ${glassMsg===g.id?'bad':''}" onclick="pickGlass('${g.id}')">${pic('glass-'+g.id)}<span class="ig-n">${g.n}</span></div>`).join('')}
      </div>
      <button class="btn2" onclick="skip()">SKIP →</button>
    </div>`;
    return;
  }

  // ── Step 2: ingredients ──
  app.innerHTML=`<div class="gm">${head(2,'INGREDIENTS')}
    ${retryMsg?`<div class="retry-ban">
      <div class="t">Almost! Give it another shot.</div>
      <div class="s">
        ${retryMsg.right.length?`<span class="retry-right">✓ ${retryMsg.right.join(', ')}</span><br>`:''}
        ${retryMsg.wrong.length?`<span class="retry-wrong">✕ ${retryMsg.wrong.join(', ')}</span><br>`:''}
        <span style="color:var(--amber);font-size:13px;">Hint: ${retryMsg.hint}</span>
      </div>
    </div>`:''}
    <div class="tray">${sel.map(n=>`<div class="tray-d" style="background:${LC[n]||c.color};"></div>`).join('')}<span class="tray-c">${sel.length} / ${c.ing.length}</span></div>
    <div class="ing-l">SELECT ${c.ing.length} INGREDIENTS</div>
    <div class="ings">
      ${roundIngs.map(n=>`<div class="ig ${sel.includes(n)?'sel':''}" data-i="${n}" onclick="tap('${n.replace(/'/g,"\\'")}')">
        ${getIcon(n)}
        <span class="ig-n">${n}</span>
      </div>`).join('')}
    </div>
    <button class="btn2" onclick="skip()">SKIP →</button>
  </div>`;
}

// ═══ CHECK MY TURN ═══
const myId=new URLSearchParams(location.search).get('id');
let turnVisible=false;
if(myId)document.getElementById('check-btn').style.display='block';

async function checkTurn(){
  if(turnVisible){closeTurn();return;}
  try{
    const r=await fetch('/api/queue');
    if(!r.ok)return;
    const q=await r.json();
    const queue=Array.isArray(q)?q:(q.queue||[]);
    const me=queue.find(e=>e.id===myId);
    const ov=document.getElementById('turn-overlay');
    if(!me){
      ov.innerHTML=`<div class="turn-overlay">
        <div style="font-size:40px;margin-bottom:12px;">✅</div>
        <div class="turn-pos">Your waiting is complete!</div>
        <div class="turn-total" style="margin-top:8px;">Please check your notifications.</div>
        <button class="turn-close" onclick="closeTurn()">BACK TO GAME</button>
      </div>`;
    }else if(me.status==='called'){
      ov.innerHTML=`<div class="turn-overlay">
        <div style="font-size:40px;margin-bottom:12px;">🔔</div>
        <div class="turn-pos" style="color:var(--ok);font-size:24px;">Your table is ready!</div>
        <div class="turn-total" style="margin-top:8px;">Please head to the bar when you're ready.</div>
        <a href="/customer.html?id=${myId}" class="turn-close" style="text-decoration:none;background:var(--ok);color:var(--ink);border-color:var(--ok);display:inline-block;margin-top:16px;">GO TO WAITING PAGE</a>
        <button class="turn-close" onclick="closeTurn()" style="margin-top:10px;">FINISH THIS ROUND FIRST</button>
      </div>`;
    }else{
      const w=queue.filter(e=>e.status==='waiting');
      const pos=w.findIndex(e=>e.id===myId)+1;
      ov.innerHTML=`<div class="turn-overlay">
        <div class="turn-num">${me.number}</div>
        <div class="turn-label">YOUR NUMBER</div>
        <div class="turn-pos"><strong>#${pos}</strong> in line</div>
        <div class="turn-total">${w.length} total waiting</div>
        <button class="turn-close" onclick="closeTurn()">BACK TO GAME</button>
      </div>`;
    }
    ov.style.display='block';
    turnVisible=true;
  }catch{}
}
function closeTurn(){document.getElementById('turn-overlay').style.display='none';turnVisible=false;}

// ═══ HOW TO PLAY → game (same sequence as the party mini games) ═══
function showHowto(){
  const ht=document.getElementById('howto');
  const words=['htHow','htTo','htPlay'];
  words.forEach(id=>{const el=document.getElementById(id);el.classList.remove('land','hit');void el.offsetWidth;});
  ht.classList.remove('hidden');
  words.forEach((id,i)=>{setTimeout(()=>{const el=document.getElementById(id);el.classList.add('land');
    setTimeout(()=>{el.classList.add('hit');if(navigator.vibrate)navigator.vibrate(10);setTimeout(()=>el.classList.remove('hit'),200);},238);},56+i*266);});
  const go=e=>{if(e)e.preventDefault();ht.classList.add('hidden');ht.removeEventListener('pointerdown',go);reqM();start();};
  ht.addEventListener('pointerdown',go);
}
render();
showHowto();
</script>
